name: CI

on:
  push:
    branches: [ main, master, develop, claude/* ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  build-and-test-macos:
    name: Build and Test (macOS)
    runs-on: macos-15

    strategy:
      matrix:
        swift-version: ['6.0']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Swift
      uses: swift-actions/setup-swift@v2
      with:
        swift-version: ${{ matrix.swift-version }}

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v

    - name: Build release
      run: swift build -c release

  build-and-test-linux:
    name: Build and Test (Linux)
    runs-on: ubuntu-latest

    container:
      image: swift:6.0

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Swift version
      run: swift --version

    - name: Build
      run: swift build -v

    - name: Run tests
      run: swift test -v

    - name: Build release
      run: swift build -c release

  lint:
    name: SwiftLint
    runs-on: macos-15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint --strict
      continue-on-error: true
